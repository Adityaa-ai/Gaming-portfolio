<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Portfolio Game</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- 🏠 HOME -->
<div id="home">

  <!-- 🔝 TOP BAR -->
  <div class="top-bar">
    <div class="player-info">
      <span class="player-title">Aditya Jagtap</span>
      <span>Level: <span id="level">1</span></span>
      <span>XP: <span id="xp">0</span></span>

      <div class="xp-bar">
        <div id="xp-fill"></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="home-container">

    <!-- PLAYER -->
    <div class="player-section">
      <div class="player-box">
        <img src="assests/images/avatar.png" alt="Avatar" class="avatar">
        <h2 class="player-name">Aditya Jagtap</h2>
        <p class="tagline">🎮 Leveling up through real-world projects</p>
      </div>
    </div>

    <!-- MENU -->
    <div class="menu-section">
      <button id="enter-game">Enter Game</button>
      <button onclick="showScene('skills')">Skills</button>
      <button onclick="showScene('contact')">Contact</button>
    </div>

  </div>
</div>

<!-- 🗺️ PROJECTS -->
<div id="projects" class="scene">
  <h2>Choose Mission</h2>
  <div id="project-list"></div>
  <button onclick="goHome()">Back</button>
</div>

<!-- 🧾 PREVIEW -->
<div id="preview" class="scene">
  <h2 id="preview-title"></h2>
  <p id="preview-tech"></p>
  <p id="preview-desc"></p>

  <button id="enter-project">Enter Game</button>
  <button onclick="showScene('projects')">Back</button>
</div>

<!-- 🎮 PROJECT VIEW -->
<div id="project-view" class="scene">
  <h2 id="project-title"></h2>
  <p id="project-tech"></p>

  <div id="project-demo">
    <p>Project Preview Area</p>
  </div>

  <button id="complete-btn">Complete Mission</button>
  <button onclick="showScene('projects')">Back</button>
</div>

<!-- 🌳 SKILLS -->
<div id="skills" class="scene">
  <h2>Skill Tree</h2>

  <div class="skill-tree">
    <div class="skill unlocked">HTML</div>
    <div class="skill unlocked">CSS</div>
    <div class="skill unlocked">JavaScript</div>
    <div class="skill locked">React</div>
  </div>

  <button onclick="goHome()">Back</button>
</div>

<!-- 📞 CONTACT -->
<div id="contact" class="scene">
  <h2>Contact</h2>
  <p>Email: aditya.jagtap2309@gmailcom</p>
  <p>GitHub: Adityaa-ai</p>
  <p>LinkedIn: Aditya Satish Jagtap</p>
  <button onclick="goHome()">Back</button>
</div>

<!-- 🏆 ACHIEVEMENT -->
<div id="achievement" class="achievement">
  <p id="achievement-text"></p>
</div>

<!-- SCRIPTS -->
<script src="js/data.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/scenes.js" defer></script>
<script src="js/main.js" defer></script>

</body>
</html>
